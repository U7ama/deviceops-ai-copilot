name: deviceops

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: deviceops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-deviceops_admin_dev}
      DEVICEOPS_APP_DB_PASSWORD: ${DEVICEOPS_APP_DB_PASSWORD:-deviceops_app_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deviceops_postgres:/var/lib/postgresql/data
      - ./infra/postgres/001-create-app-role.sh:/docker-entrypoint-initdb.d/001-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deviceops"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.0.0
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-deviceops-n8n-encryption-key-change-me}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-local-deviceops-n8n-webhook-secret-change-me}
      DEVICEOPS_CORE_URL: ${DEVICEOPS_CORE_URL:-http://host.docker.internal:3000}
      MAILPIT_API_URL: ${MAILPIT_API_URL:-http://host.docker.internal:8025/api/v1/send}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Karachi
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - deviceops_n8n:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - deviceops_mailpit:/data
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

  clamav:
    profiles: ["media-security"]
    image: clamav/clamav:1.4.3
    expose:
      - "3310"
    volumes:
      - deviceops_clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310 | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  deviceops_postgres:
  deviceops_n8n:
  deviceops_mailpit:
  deviceops_clamav_signatures:
