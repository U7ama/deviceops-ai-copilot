<title id="title">DeviceOps — Autonomous Incident Triage Agent architecture</title><desc id="desc">Device observations enter a tenant-scoped Next.js API. A PostgreSQL-backed worker detects incidents and invokes AWS Strands with Gemini. Seven read-only MCP tools retrieve evidence through the API. The backend controls approval, simulator execution and verified recovery. Bedrock and Titan are optional account-blocked paths.</desc>
