<title id="title">DeviceOps — Autonomous Operations &amp; Incident Resolution architecture</title><desc id="desc">Device observations enter a tenant-scoped Next.js API. Mobile photos upload directly to that API. A PostgreSQL-backed worker detects incidents. Strands multi-agent specialist reasoning runs with Alibaba Cloud Qwen models; backend controls approval, simulator execution and verified recovery.</desc>
